<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPD123 - Tiếng Nhật 2 (Fall 2026) | Trung Tâm Luyện Thi Toàn Diện</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            jp: ['"Noto Sans JP"', '"Hiragino Kaku Gothic ProN"', 'Meiryo', 'sans-serif']
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .jp-font {
      font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .speaking-pulse {
      animation: pulse-ring 1.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800 antialiased selection:bg-blue-100 selection:text-blue-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Embedded Clean Datasets
    const vocabData = __VOCAB_JSON__;
    const grammarData = __GRAMMAR_JSON__;
    const speakingData = __SPEAKING_JSON__;
    const kanjiData = __KANJI_JSON__;
    const readingData = __READING_JSON__;
    const verbsData = __VERBS_JSON__;
    const kanjiUnifiedData = __KANJI_UNIFIED_JSON__;
    const mustPassKanjiData = __MUST_PASS_KANJI_JSON__;
    const speakingPicturesData = __SPEAKING_PICTURES_JSON__;

    // Text to Speech Service
    const speakText = (text, lang = 'ja-JP', onEnd) => {
      if (!('speechSynthesis' in window)) {
        alert('Trình duyệt của bạn không hỗ trợ tính năng đọc âm thanh Web Speech API.');
        return;
      }
      window.speechSynthesis.cancel();
      const clean = text.replace(/[／/()（）\n]/g, ' ').trim();
      if (!clean) return;

      const utterance = new SpeechSynthesisUtterance(clean);
      utterance.lang = lang;
      utterance.rate = 0.9;
      utterance.pitch = 1.0;
      if (onEnd) utterance.onend = onEnd;
      utterance.onerror = () => { if (onEnd) onEnd(); };
      window.speechSynthesis.speak(utterance);
    };

    // Audio Button Component
    const AudioButton = ({ text, lang = 'ja-JP', size = 'md', className = '' }) => {
      const [playing, setPlaying] = useState(false);
      const handleClick = (e) => {
        e.stopPropagation();
        setPlaying(true);
        speakText(text, lang, () => setPlaying(false));
      };

      const sizeClasses = size === 'sm' ? 'w-8 h-8 text-xs' : size === 'lg' ? 'w-11 h-11 text-base' : 'w-9 h-9 text-sm';

      return (
        <button
          onClick={handleClick}
          title="Nghe phát âm tiếng Nhật chuẩn"
          className={`relative inline-flex items-center justify-center rounded-xl bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white transition-all shadow-sm active:scale-95 flex-shrink-0 ${sizeClasses} ${playing ? 'ring-2 ring-blue-400 bg-blue-600 text-white' : ''} ${className}`}
        >
          <svg className={`w-4 h-4 ${playing ? 'speaking-pulse' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          </svg>
        </button>
      );
    };

    // -------------------------------------------------------------
    // NAVIGATION BAR
    // -------------------------------------------------------------
    const Navbar = ({ activeTab, setActiveTab, selectedLesson, setSelectedLesson, onOpenArchive, searchQuery, setSearchQuery }) => {
      const tabs = [
        { id: 'must_pass', label: '🔥 Trọng Tâm Thi 100%', count: mustPassKanjiData.length, icon: '🔥' },
        { id: 'speaking_pictures', label: '🖼️ Luyện Nói Nhìn Tranh', count: speakingPicturesData.filter(x => x.has_picture).length, icon: '🖼️' },
        { id: 'vocab', label: 'Từ vựng', count: vocabData.length, icon: '📖' },
        { id: 'grammar', label: 'Ngữ pháp', count: grammarData.length, icon: '📝' },
        { id: 'kanji', label: 'Hán tự (Kanji)', count: kanjiData.length, icon: '🎴' },
        { id: 'speaking', label: 'Mẫu câu & Speaking', count: 35, icon: '🗣️' },
        { id: 'reading', label: 'Đọc hiểu (10 Đề)', count: readingData.length, icon: '📑' }
      ];

      return (
        <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-sm transition-all">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between h-16 sm:h-20 gap-4">
              {/* Brand & Course Badge */}
              <div className="flex items-center gap-3 flex-shrink-0 cursor-pointer" onClick={() => { setActiveTab('vocab'); setSelectedLesson(0); }}>
                <div className="w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-violet-600 text-white flex items-center justify-center font-black text-xl shadow-md shadow-blue-500/20">
                  日
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-lg sm:text-xl tracking-tight text-slate-900">JPD123</span>
                    <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-blue-100 text-blue-700">
                      Fall 2026
                    </span>
                  </div>
                  <p className="text-xs text-slate-500 font-medium hidden sm:block">Trung tâm Ôn tập & Luyện thi Tiếng Nhật 2</p>
                </div>
              </div>

              {/* Quick Search Bar */}
              <div className="hidden md:flex flex-1 max-w-md relative">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Tra cứu từ vựng, ngữ pháp, kanji..."
                  className="w-full pl-9 pr-8 py-2 rounded-xl bg-slate-100 border border-transparent focus:border-blue-400 focus:bg-white text-sm outline-none transition-all"
                />
                <svg className="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                {searchQuery && (
                  <button onClick={() => setSearchQuery('')} className="absolute right-2.5 top-2.5 text-slate-400 hover:text-slate-600 text-xs">
                    ✕
                  </button>
                )}
              </div>

              {/* Action Buttons */}
              <div className="flex items-center gap-2 flex-shrink-0">
                <button
                  onClick={onOpenArchive}
                  className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all"
                  title="Mở tài liệu lưu trữ kỳ trước JPD113"
                >
                  <span className="w-2 h-2 rounded-full bg-slate-400"></span>
                  <span className="hidden sm:inline">Kho lưu trữ</span> JPD113
                </button>
                <div className="h-4 w-px bg-slate-200 mx-1 hidden sm:block"></div>
                <button
                  onClick={() => speakText('こんにちは。がんばりましょう！')}
                  className="p-2 rounded-xl text-slate-500 hover:text-blue-600 hover:bg-blue-50 transition-all text-xs"
                  title="Thử âm thanh loa"
                >
                  🔊 <span className="hidden lg:inline text-xs font-medium">Test Audio</span>
                </button>
              </div>
            </div>

            {/* Main Tabs Navigation */}
            <nav className="flex items-center space-x-1 sm:space-x-2 overflow-x-auto py-2 no-scrollbar border-t border-slate-100">
              {tabs.map((tab) => {
                const isActive = activeTab === tab.id;
                const isSpecial = tab.id === 'must_pass';
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex items-center gap-2 px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all duration-200 ${
                      isActive
                        ? (tab.id === 'must_pass' 
                            ? 'bg-gradient-to-r from-rose-600 via-red-600 to-amber-600 text-white shadow-md shadow-rose-500/30 scale-[1.02] ring-2 ring-rose-400' 
                            : tab.id === 'speaking_pictures'
                            ? 'bg-gradient-to-r from-purple-600 via-indigo-600 to-blue-600 text-white shadow-md shadow-purple-500/30 scale-[1.02] ring-2 ring-purple-400 font-extrabold'
                            : 'bg-blue-600 text-white shadow-sm shadow-blue-500/25 scale-[1.02]')
                        : (tab.id === 'must_pass' 
                            ? 'bg-rose-50 text-rose-700 hover:bg-rose-100 border border-rose-200 shadow-sm font-extrabold' 
                            : tab.id === 'speaking_pictures'
                            ? 'bg-purple-50 text-purple-700 hover:bg-purple-100 border border-purple-200 shadow-sm font-extrabold'
                            : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100/80')
                    }`}
                  >
                    <span>{tab.icon}</span>
                    <span>{tab.label}</span>
                    <span className={`px-1.5 py-0.2 rounded-full text-[10px] ${
                      isActive 
                        ? (tab.id === 'must_pass' ? 'bg-rose-700 text-rose-100' : tab.id === 'speaking_pictures' ? 'bg-purple-800 text-purple-100' : 'bg-blue-700 text-blue-100')
                        : (tab.id === 'must_pass' ? 'bg-rose-200 text-rose-800' : tab.id === 'speaking_pictures' ? 'bg-purple-200 text-purple-800 font-bold' : 'bg-slate-200/80 text-slate-600')
                    }`}>
                      {tab.count}
                    </span>
                  </button>
                );
              })}
            </nav>
          </div>
        </header>
      );
    };

    // -------------------------------------------------------------
    // UNIFIED LESSON SELECTOR PILLS
    // -------------------------------------------------------------
    const LessonSelector = ({ selectedLesson, setSelectedLesson, activeTab }) => {
      if (activeTab === 'reading' || activeTab === 'must_pass' || activeTab === 'speaking_pictures') return null; // Uses its own view

      const lessons = [
        { id: 0, label: 'Tất cả (Bài 4〜7)', desc: 'Toàn bộ giáo trình' },
        { id: 4, label: 'Bài 4', desc: 'Phương hướng & Tính từ' },
        { id: 5, label: 'Bài 5', desc: 'Quá khứ & Mong muốn' },
        { id: 6, label: 'Bài 6', desc: 'Rủ rê & So sánh' },
        { id: 7, label: 'Bài 7', desc: 'Vị trí & Thể Te (て)' }
      ];

      return (
        <div className="bg-white rounded-2xl p-2 border border-slate-200/80 shadow-sm mb-6">
          <div className="flex items-center gap-1.5 sm:gap-2 overflow-x-auto no-scrollbar">
            {lessons.map((l) => {
              const active = selectedLesson === l.id;
              return (
                <button
                  key={l.id}
                  onClick={() => setSelectedLesson(l.id)}
                  className={`flex-1 min-w-[100px] sm:min-w-[120px] py-2 px-3 rounded-xl text-center transition-all ${
                    active
                      ? 'bg-slate-900 text-white shadow-sm font-bold scale-[1.01]'
                      : 'bg-transparent text-slate-600 hover:bg-slate-100 font-medium'
                  }`}
                >
                  <div className="text-xs sm:text-sm tracking-tight">{l.label}</div>
                  <div className={`text-[10px] truncate ${active ? 'text-slate-300' : 'text-slate-400'}`}>{l.desc}</div>
                </button>
              );
            })}
          </div>
        </div>
      );
    };

    // -------------------------------------------------------------
    // 1. VOCABULARY SECTION
    // -------------------------------------------------------------
    const VocabSection = ({ selectedLesson, searchQuery, starred, toggleStar }) => {
      const [viewMode, setViewMode] = useState('flashcard'); // flashcard, list, quiz
      const [starredOnly, setStarredOnly] = useState(false);
      const [subFilter, setSubFilter] = useState('all');
      const [showHira, setShowHira] = useState(false); // default: Hán tự ẩn Hira
      const [showRomaji, setShowRomaji] = useState(false); // default: ẩn phiên âm Roman
      const [revealedHira, setRevealedHira] = useState({});
      const [revealedRomaji, setRevealedRomaji] = useState({});

      const toggleRevealHira = (id) => {
        setRevealedHira((prev) => ({ ...prev, [id]: !prev[id] }));
      };
      const toggleRevealRomaji = (id) => {
        setRevealedRomaji((prev) => ({ ...prev, [id]: !prev[id] }));
      };

      // Filter data
      const filteredVocab = useMemo(() => {
        return vocabData.filter((item) => {
          if (selectedLesson !== 0 && item.lesson !== selectedLesson) return false;
          if (starredOnly && !starred.has(item.id)) return false;
          if (subFilter !== 'all' && item.sub !== subFilter) return false;
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            return (
              item.word.toLowerCase().includes(q) ||
              item.reading.toLowerCase().includes(q) ||
              item.meaning.toLowerCase().includes(q) ||
              item.romaji.toLowerCase().includes(q)
            );
          }
          return true;
        });
      }, [selectedLesson, starredOnly, subFilter, searchQuery, starred]);

      // Subtopics list for lesson
      const subtopics = useMemo(() => {
        const set = new Set();
        vocabData.forEach(v => {
          if (selectedLesson === 0 || v.lesson === selectedLesson) set.add(v.sub);
        });
        return Array.from(set);
      }, [selectedLesson]);

      // Flashcard state
      const [cardIndex, setCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      useEffect(() => {
        setCardIndex(0);
        setIsFlipped(false);
      }, [selectedLesson, starredOnly, subFilter, searchQuery]);

      const currentCard = filteredVocab[cardIndex] || null;

      const nextCard = () => {
        if (!filteredVocab.length) return;
        setIsFlipped(false);
        setCardIndex((prev) => (prev + 1) % filteredVocab.length);
      };

      const prevCard = () => {
        if (!filteredVocab.length) return;
        setIsFlipped(false);
        setCardIndex((prev) => (prev - 1 + filteredVocab.length) % filteredVocab.length);
      };

      const shuffleCards = () => {
        setIsFlipped(false);
        setCardIndex(Math.floor(Math.random() * filteredVocab.length));
      };

      // Keyboard navigation
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (viewMode !== 'flashcard' || !filteredVocab.length) return;
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            setIsFlipped((prev) => !prev);
          } else if (e.key === 'ArrowRight') {
            nextCard();
          } else if (e.key === 'ArrowLeft') {
            prevCard();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [viewMode, filteredVocab.length]);

      return (
        <div>
          {/* Subheader & Controls */}
          <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mb-6">
            <div className="flex items-center gap-1.5 p-1 bg-slate-200/70 rounded-xl max-w-fit">
              <button
                onClick={() => setViewMode('flashcard')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${viewMode === 'flashcard' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                🎴 Flashcard 3D
              </button>
              <button
                onClick={() => setViewMode('list')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${viewMode === 'list' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                📋 Danh sách ({filteredVocab.length})
              </button>
              <button
                onClick={() => setViewMode('quiz')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${viewMode === 'quiz' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                ⚡ Phòng Thi Thử (Test)
              </button>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={() => setShowHira(!showHira)}
                className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border text-xs font-bold transition-all ${
                  showHira 
                    ? 'bg-indigo-600 border-indigo-600 text-white shadow-sm' 
                    : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-100'
                }`}
                title="Bật/Tắt hiển thị Hiragana cho Hán tự"
              >
                <span>あ</span> {showHira ? 'Ẩn Hira Hán tự' : 'Hiện Hira Hán tự'}
              </button>
              <button
                onClick={() => setShowRomaji(!showRomaji)}
                className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border text-xs font-bold transition-all ${
                  showRomaji 
                    ? 'bg-blue-600 border-blue-600 text-white shadow-sm' 
                    : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-100'
                }`}
                title="Bật/Tắt hiển thị phiên âm Romaji"
              >
                <span>🔤</span> {showRomaji ? 'Ẩn Phiên âm' : 'Hiện Phiên âm'}
              </button>
              <button
                onClick={() => setStarredOnly(!starredOnly)}
                className={`inline-flex items-center gap-1 px-3 py-1.5 rounded-xl border text-xs font-bold transition-all ${starredOnly ? 'bg-amber-50 border-amber-300 text-amber-700' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-100'}`}
              >
                <span>⭐</span> Yêu thích ({starred.size})
              </button>
            </div>
          </div>

          {/* Subtopic Filters */}
          {subtopics.length > 1 && (
            <div className="flex items-center gap-2 overflow-x-auto no-scrollbar pb-3 mb-4 text-xs">
              <span className="text-slate-400 font-semibold flex-shrink-0">Chủ đề:</span>
              <button
                onClick={() => setSubFilter('all')}
                className={`px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap transition-all ${subFilter === 'all' ? 'bg-blue-600 text-white' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100'}`}
              >
                Tất cả chủ đề
              </button>
              {subtopics.map((st) => (
                <button
                  key={st}
                  onClick={() => setSubFilter(st)}
                  className={`px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap transition-all ${subFilter === st ? 'bg-blue-600 text-white' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100'}`}
                >
                  {st}
                </button>
              ))}
            </div>
          )}

          {/* FLASHCARD VIEW */}
          {viewMode === 'flashcard' && (
            <div className="max-w-xl mx-auto py-2">
              {filteredVocab.length === 0 ? (
                <div className="text-center py-16 bg-white rounded-3xl border border-slate-200">
                  <p className="text-slate-500 font-medium">Không tìm thấy từ vựng nào khớp với bộ lọc.</p>
                  <button onClick={() => { setStarredOnly(false); setSubFilter('all'); }} className="mt-3 text-sm text-blue-600 font-semibold underline">
                    Đặt lại bộ lọc
                  </button>
                </div>
              ) : (
                <div>
                  <div className="flex items-center justify-between text-xs text-slate-500 font-semibold mb-3 px-2">
                    <span>Thẻ {cardIndex + 1} / {filteredVocab.length}</span>
                    <span className="text-slate-400">Ấn phím Cách hoặc chạm để lật thẻ</span>
                    <button
                      onClick={() => toggleStar(currentCard.id)}
                      className={`p-1.5 rounded-lg border text-sm ${starred.has(currentCard.id) ? 'bg-amber-50 border-amber-300 text-amber-500' : 'bg-white border-slate-200 text-slate-400 hover:text-amber-500'}`}
                      title="Lưu vào danh sách yêu thích"
                    >
                      {starred.has(currentCard.id) ? '★' : '☆'}
                    </button>
                  </div>

                  {/* 3D Flippable Card */}
                  <div
                    onClick={() => setIsFlipped(!isFlipped)}
                    className="relative w-full h-80 sm:h-96 perspective-1000 cursor-pointer select-none group"
                  >
                    <div className={`w-full h-full duration-500 transform-style-3d transition-transform ${isFlipped ? 'rotate-y-180' : ''}`}>
                      {/* FRONT FACE */}
                      <div className="absolute inset-0 w-full h-full rounded-3xl bg-white border border-slate-200/90 shadow-md p-8 flex flex-col justify-between backface-hidden group-hover:border-blue-400 group-hover:shadow-lg transition-all">
                        <div className="flex items-center justify-between">

                            <div className="mb-2">

                                <button

                          <div className="min-h-[26px]">

                          </div>

                        <div className="text-center text-xs font-semibold text-slate-400 flex items-center justify-center gap-1">
                          <span>Chạm hoặc ấn Space để xem nghĩa</span> ↻

                      </div>

                      {/* BACK FACE */}
                      <div className="absolute inset-0 w-full h-full rounded-3xl bg-gradient-to-tr from-slate-900 via-indigo-950 to-blue-950 text-white p-8 flex flex-col justify-between backface-hidden rotate-y-180 shadow-md">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-white/10 text-blue-300">
                            Ý nghĩa & Cách dùng
                          </span>
                          <AudioButton text={currentCard.word || currentCard.reading} size="md" className="bg-white/10 text-white hover:bg-white/20" />
                        </div>

                        <div className="text-center my-auto">
                          <p className="text-xs text-indigo-300 font-semibold uppercase tracking-wider mb-2">Định nghĩa tiếng Việt</p>
                          <h3 className="text-2xl sm:text-3xl font-extrabold text-amber-300 mb-4 leading-tight">
                            {currentCard.meaning}
                          </h3>
                          <div className="inline-flex items-center gap-2 px-3 py-1 rounded-xl bg-white/10 text-slate-200 text-sm jp-font">
                            <span>{currentCard.word}</span>
                            <span>=</span>
                            <span>{currentCard.reading}</span>
                          </div>
                        </div>

                        <div className="text-center text-xs font-semibold text-indigo-300 flex items-center justify-center gap-1">
                          <span>Chạm để quay lại mặt trước</span> ↻
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Card Controls */}
                  <div className="flex items-center justify-center gap-4 mt-6">
                    <button
                      onClick={prevCard}
                      className="px-5 py-2.5 rounded-2xl bg-white border border-slate-200 text-slate-700 font-bold text-sm hover:bg-slate-100 hover:border-slate-300 shadow-sm active:scale-95 transition-all flex items-center gap-2"
                    >
                      ← Từ trước
                    </button>
                    <button
                      onClick={shuffleCards}
                      className="p-2.5 rounded-2xl bg-white border border-slate-200 text-slate-500 hover:text-blue-600 hover:border-blue-300 shadow-sm transition-all"
                      title="Xáo trộn ngẫu nhiên"
                    >
                      🔀
                    </button>
                    <button
                      onClick={nextCard}

                    >

          {/* LIST VIEW */}
          {viewMode === 'list' && (
            <div className="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden">
              <div className="p-4 sm:p-6 border-b border-slate-100 flex items-center justify-between gap-4">
                <h3 className="font-extrabold text-base text-slate-900">
                  Danh sách Từ vựng ({filteredVocab.length} từ)
                </h3>
                <span className="text-xs text-slate-400">Ấn vào loa để nghe phát âm</span>

              <div className="divide-y divide-slate-100 max-h-[600px] overflow-y-auto">
                {filteredVocab.map((item) => (
                  <div key={item.id} className="p-4 sm:p-5 hover:bg-slate-50/80 flex items-center justify-between gap-4 transition-all group">
                    <div className="flex items-start gap-4">
                      <button
                        onClick={() => toggleStar(item.id)}
                        className={`text-lg mt-0.5 ${starred.has(item.id) ? 'text-amber-500' : 'text-slate-300 hover:text-amber-400'}`}
                      >
                        {starred.has(item.id) ? '★' : '☆'}
                      </button>
                      <div>
                        <div className="flex items-center gap-2.5 flex-wrap">
                          <span className="text-lg sm:text-xl font-bold text-slate-900 jp-font">
                            {item.word}
                          </span>
                          {item.word !== item.reading && (
                            showHira || revealedHira[item.id] ? (
                              <span
                                onClick={() => toggleRevealHira(item.id)}
                                title="Bấm để ẩn Hira"
                                className="text-sm font-semibold text-indigo-700 jp-font bg-indigo-50 border border-indigo-100 px-2 py-0.5 rounded-lg cursor-pointer hover:bg-indigo-100 transition-all"
                              >
                                {item.reading}
                              </span>
                            ) : (
                              <button
                                onClick={() => toggleRevealHira(item.id)}
                                className="text-[11px] font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200/60 px-2 py-0.5 rounded-lg transition-all active:scale-95 flex items-center gap-1"
                                title="Bấm để hiện cách đọc Hiragana"
                              >
                                <span>👁️</span> Hiện Hira
                              </button>
                            )
                          )}
                          {showRomaji || revealedRomaji[item.id] ? (
                            <span
                              onClick={() => toggleRevealRomaji(item.id)}
                              title="Bấm để ẩn phiên âm"
                              className="text-xs text-slate-600 font-mono bg-slate-100 px-2 py-0.5 rounded-lg cursor-pointer hover:bg-slate-200 transition-all"
                            >
                              {item.romaji}
                            </span>
                          ) : (
                            <button
                              onClick={() => toggleRevealRomaji(item.id)}
                              className="text-[11px] font-mono text-slate-400 bg-slate-100/70 hover:bg-slate-200 hover:text-slate-700 px-1.5 py-0.5 rounded transition-all active:scale-95 flex items-center gap-1"
                              title="Bấm để hiện phiên âm Roman"
                            >
                              <span>👁️</span> Hiện phiên âm
                            </button>
                          )}
                        </div>
                        <p className="text-sm sm:text-base font-semibold text-slate-700 mt-1">
                          {item.meaning}
                        </p>
                        <span className="inline-block mt-1 text-[11px] font-medium text-slate-400">
                          Bài {item.lesson} • {item.sub}
                        </span>
                      </div>
                    </div>
                    <AudioButton text={item.word || item.reading} size="md" />
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* TEST CENTER VIEW */}
          {viewMode === 'quiz' && (
            <VocabTestCenter
              vocabList={vocabData}
              currentFilteredVocab={filteredVocab}
              selectedLesson={selectedLesson}
              starred={starred}
              toggleStar={toggleStar}
              onBack={() => setViewMode('flashcard')}
            />
          )}
        </div>
      );
    };


    // -------------------------------------------------------------
    // ENHANCED VOCAB TEST CENTER (PHÒNG THI THỬ & TEST TỪ VỰNG TOÀN DIỆN)
    // -------------------------------------------------------------
    const VocabTestCenter = ({ vocabList, currentFilteredVocab, selectedLesson, starred, toggleStar, onBack }) => {
      // Phases: 'setup' | 'playing' | 'result'
      const [phase, setPhase] = useState('setup');
      
      // Setup configurations
      const [testMode, setTestMode] = useState('jp_to_vn'); // 'jp_to_vn' | 'vn_to_jp' | 'audio_to_vn' | 'speed_15s'
      const [testScope, setTestScope] = useState(selectedLesson !== 0 ? `lesson${selectedLesson}` : 'all');
      const [questionCount, setQuestionCount] = useState(15);
      
      // Playing states
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [showResult, setShowResult] = useState(false);
      const [wrongList, setWrongList] = useState([]);
      const [timeLeft, setTimeLeft] = useState(15);
      const [timerActive, setTimerActive] = useState(false);
      const [hintHira, setHintHira] = useState(false);
      const [hintRomaji, setHintRomaji] = useState(false);

      // Auto audio playback in listening mode
      useEffect(() => {
        if (phase === 'playing' && questions[currentIndex]) {
          const currentQ = questions[currentIndex];
          if (currentQ.mode === 'audio_to_vn' || testMode === 'audio_to_vn') {
            speakText(currentQ.target.word || currentQ.target.reading);
          }
        }
      }, [phase, currentIndex]);

      // Timer countdown for speed challenge
      useEffect(() => {
        let timer = null;
        if (phase === 'playing' && timerActive && timeLeft > 0 && !showResult) {
          timer = setInterval(() => {
            setTimeLeft(t => t - 1);
          }, 1000);
        } else if (timeLeft === 0 && !showResult && timerActive) {
          // Time out -> Auto mark incorrect
          handleSelectOption(null, true);
        }
        return () => clearInterval(timer);
      }, [phase, timerActive, timeLeft, showResult]);

      // Filter vocab pool by scope
      const getVocabPool = (scope) => {
        let pool = [...vocabList];
        if (scope === 'lesson4') pool = pool.filter(v => v.lesson === 4);
        else if (scope === 'lesson5') pool = pool.filter(v => v.lesson === 5);
        else if (scope === 'lesson6') pool = pool.filter(v => v.lesson === 6);
        else if (scope === 'lesson7') pool = pool.filter(v => v.lesson === 7);
        else if (scope === 'starred') pool = pool.filter(v => starred.has(v.id));
        else if (scope === 'filtered') pool = [...currentFilteredVocab];
        return pool;
      };

      // Start Exam Generator
      const startExam = (customPool = null, customMode = null) => {
        const pool = customPool || getVocabPool(testScope);
        const mode = customMode || testMode;

        if (pool.length < 4) {
          alert(`Nguồn từ vựng hiện tại chỉ có ${pool.length} từ. Cần tối thiểu 4 từ để tạo đề thi! Bạn có thể chọn nguồn khác.`);
          return;
        }

        const count = questionCount === 'all' ? pool.length : Math.min(Number(questionCount), pool.length);
        const shuffledPool = [...pool].sort(() => 0.5 - Math.random());
        const selectedTargets = shuffledPool.slice(0, count);

        const allVocabForDistractors = vocabList.length >= 4 ? vocabList : pool;

        const generatedQuestions = selectedTargets.map((target) => {
          let prompt = '';
          let answer = '';
          let wrongOptions = [];

          if (mode === 'jp_to_vn' || mode === 'speed_15s') {
            // Prompt: Japanese word -> Answer: Vietnamese
            prompt = target.word || target.reading;
            answer = target.meaning;
            wrongOptions = allVocabForDistractors
              .filter(v => v.id !== target.id && v.meaning !== target.meaning)
              .sort(() => 0.5 - Math.random())
              .slice(0, 3)
              .map(v => v.meaning);
          } else if (mode === 'vn_to_jp') {
            // Prompt: Vietnamese -> Answer: Japanese
            prompt = target.meaning;
            const targetJp = target.word !== target.reading ? `${target.word} (${target.reading})` : target.reading;
            answer = targetJp;
            wrongOptions = allVocabForDistractors
              .filter(v => v.id !== target.id)
              .sort(() => 0.5 - Math.random())
              .slice(0, 3)
              .map(v => v.word !== v.reading ? `${v.word} (${v.reading})` : v.reading);
          } else if (mode === 'audio_to_vn') {
            // Prompt: Sound only -> Answer: Vietnamese
            prompt = '🔊 Bấm để nghe lại phát âm';
            answer = target.meaning;
            wrongOptions = allVocabForDistractors
              .filter(v => v.id !== target.id && v.meaning !== target.meaning)
              .sort(() => 0.5 - Math.random())
              .slice(0, 3)
              .map(v => v.meaning);
          }

          // Ensure exactly 4 options
          while (wrongOptions.length < 3) {
            wrongOptions.push(`Lựa chọn dự phòng ${wrongOptions.length + 1}`);
          }

          const options = [...wrongOptions, answer].sort(() => 0.5 - Math.random());

          return {
            target,
            mode,
            prompt,
            answer,
            options,
            userChoice: null,
            isCorrect: false
          };
        });

        setQuestions(generatedQuestions);
        setCurrentIndex(0);
        setScore(0);
        setSelectedOption(null);
        setShowResult(false);
        setWrongList([]);
        setTimeLeft(15);
        setTimerActive(mode === 'speed_15s');
        setHintHira(false);
        setHintRomaji(false);
        setPhase('playing');
      };

      // Handle Option Selection
      const handleSelectOption = (opt, isTimeout = false) => {
        if (showResult) return;

        const currentQ = questions[currentIndex];
        const isCorrect = !isTimeout && opt === currentQ.answer;

        setSelectedOption(opt || 'TIMEOUT');
        setShowResult(true);

        currentQ.userChoice = opt || '(Hết giờ)';
        currentQ.isCorrect = isCorrect;

        if (isCorrect) {
          setScore(s => s + 1);
        } else {
          setWrongList(prev => [...prev, currentQ]);
        }
      };

      // Handle Next Question
      const handleNextQuestion = () => {
        if (currentIndex + 1 < questions.length) {
          setCurrentIndex(i => i + 1);
          setSelectedOption(null);
          setShowResult(false);
          setTimeLeft(15);
          setHintHira(false);
          setHintRomaji(false);
        } else {
          setTimerActive(false);
          setPhase('result');
        }
      };

      // Retry only wrong questions
      const handleRetryWrong = () => {
        if (!wrongList.length) return;
        const retryTargets = wrongList.map(w => w.target);
        startExam(retryTargets, testMode);
      };

      // Keyboard shortcuts: 1, 2, 3, 4 and Space/Enter
      useEffect(() => {
        if (phase !== 'playing') return;
        const handleKeyDown = (e) => {
          const currentQ = questions[currentIndex];
          if (!currentQ) return;

          if (!showResult) {
            if (['1', '2', '3', '4'].includes(e.key)) {
              const idx = parseInt(e.key) - 1;
              if (currentQ.options[idx]) {
                handleSelectOption(currentQ.options[idx]);
              }
            }
          } else {
            if (e.key === ' ' || e.key === 'Enter') {
              e.preventDefault();
              handleNextQuestion();
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [phase, currentIndex, showResult, questions]);

      // -------------------------------------------------------------
      // PHASE 1: SETUP SCREEN
      // -------------------------------------------------------------
      if (phase === 'setup') {
        const poolCount = getVocabPool(testScope).length;

        return (
          <div className="max-w-3xl mx-auto py-4">
            <div className="bg-white rounded-3xl border border-slate-200/90 p-6 sm:p-10 shadow-sm">
              {/* Header */}
              <div className="flex items-center justify-between pb-6 mb-8 border-b border-slate-100">
                <div>
                  <span className="text-xs font-extrabold px-3 py-1 rounded-full bg-blue-100 text-blue-700">
                    Phòng Luyện Thi & Khảo Thí Từ Vựng
                  </span>
                  <h2 className="text-2xl sm:text-3xl font-black text-slate-900 mt-2">
                    Cấu Hình Đề Thi Thử Từ Vựng JPD123
                  </h2>
                  <p className="text-xs sm:text-sm text-slate-500 mt-1">
                    Tùy biến chế độ ôn tập phù hợp với mục tiêu thi Giữa kỳ & Cuối kỳ của bạn.
                  </p>
                </div>
                <button
                  onClick={onBack}
                  className="px-4 py-2 rounded-xl bg-slate-100 text-slate-600 hover:text-slate-900 font-bold text-xs"
                >
                  ← Về Flashcard
                </button>
              </div>

              {/* 1. Chọn chế độ thi */}
              <div className="mb-8">
                <label className="block text-xs font-extrabold text-slate-400 uppercase tracking-wider mb-3">
                  1. Chọn Chế Độ Kiểm Tra:
                </label>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {[
                    { id: 'jp_to_vn', title: '🇯🇵 Nhật → 🇻🇳 Việt', desc: 'Nhìn chữ Kanji/Kana, chọn nghĩa tiếng Việt (Chuẩn đọc hiểu)', badge: 'Phổ biến nhất' },
                    { id: 'vn_to_jp', title: '🇻🇳 Việt → 🇯🇵 Nhật', desc: 'Nhìn nghĩa tiếng Việt, chọn đúng từ tiếng Nhật/Hán tự', badge: 'Luyện nhớ sâu' },
                    { id: 'audio_to_vn', title: '🔊 Nghe Phát Âm → Nghĩa', desc: 'Ẩn mặt chữ, nghe giọng đọc chuẩn để đoán nghĩa (Luyện Speaking)', badge: 'Phản xạ nghe' },
                    { id: 'speed_15s', title: '⏱️ Thử Thách Tốc Độ (15s)', desc: 'Áp lực thời gian 15 giây/câu, luyện tốc độ phản xạ phòng thi', badge: 'Thử thách cao' }
                  ].map(mode => (
                    <div
                      key={mode.id}
                      onClick={() => setTestMode(mode.id)}
                      className={`p-4 rounded-2xl border cursor-pointer transition-all ${
                        testMode === mode.id
                          ? 'border-blue-600 bg-blue-50/70 ring-2 ring-blue-500/20 shadow-sm'
                          : 'border-slate-200 bg-white hover:bg-slate-50'
                      }`}
                    >
                      <div className="flex items-center justify-between mb-1">
                        <h4 className="font-extrabold text-slate-900 text-base">{mode.title}</h4>
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${testMode === mode.id ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-500'}`}>
                          {mode.badge}
                        </span>
                      </div>
                      <p className="text-xs text-slate-500 leading-relaxed">{mode.desc}</p>
                    </div>
                  ))}
                </div>
              </div>

              {/* 2. Chọn phạm vi từ vựng */}
              <div className="mb-8">
                <div className="flex items-center justify-between mb-3">
                  <label className="text-xs font-extrabold text-slate-400 uppercase tracking-wider">
                    2. Chọn Nguồn Từ Vựng:
                  </label>
                  <span className="text-xs font-bold text-blue-600">
                    Kho hiện có: {poolCount} từ khả dụng
                  </span>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs font-bold">
                  {[
                    { id: 'all', label: 'Tất cả (Bài 4〜7)', count: vocabList.length },
                    { id: 'lesson4', label: 'Chỉ Bài 4', count: vocabList.filter(v => v.lesson === 4).length },
                    { id: 'lesson5', label: 'Chỉ Bài 5', count: vocabList.filter(v => v.lesson === 5).length },
                    { id: 'lesson6', label: 'Chỉ Bài 6', count: vocabList.filter(v => v.lesson === 6).length },
                    { id: 'lesson7', label: 'Chỉ Bài 7', count: vocabList.filter(v => v.lesson === 7).length },
                    { id: 'starred', label: `⭐ Đã gắn sao (${starred.size})`, count: starred.size }
                  ].map(sc => (
                    <button
                      key={sc.id}
                      type="button"
                      onClick={() => setTestScope(sc.id)}
                      className={`p-3 rounded-xl border text-center transition-all ${
                        testScope === sc.id
                          ? 'border-slate-900 bg-slate-900 text-white shadow-sm'
                          : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'
                      }`}
                    >
                      <div className="truncate">{sc.label}</div>
                      <div className={`text-[10px] mt-0.5 font-normal ${testScope === sc.id ? 'text-slate-300' : 'text-slate-400'}`}>
                        {sc.count} từ
                      </div>
                    </button>
                  ))}
                </div>
              </div>

              {/* 3. Chọn số lượng câu hỏi */}
              <div className="mb-10">
                <label className="block text-xs font-extrabold text-slate-400 uppercase tracking-wider mb-3">
                  3. Số Lượng Câu Hỏi Trong Đề:
                </label>
                <div className="flex flex-wrap items-center gap-2">
                  {[
                    { val: 10, label: '10 câu (Nhanh - 2 phút)' },
                    { val: 20, label: '20 câu (Tiêu chuẩn đề thi)' },
                    { val: 30, label: '30 câu (Chuyên sâu)' },
                    { val: 'all', label: `Toàn bộ (${poolCount} từ)` }
                  ].map(cnt => (
                    <button
                      key={cnt.val}
                      type="button"
                      onClick={() => setQuestionCount(cnt.val)}
                      className={`px-4 py-2.5 rounded-xl border text-xs font-bold transition-all ${
                        questionCount === cnt.val
                          ? 'bg-blue-600 border-blue-600 text-white shadow-sm'
                          : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                      }`}
                    >
                      {cnt.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Start Button */}
              <div className="pt-4 border-t border-slate-100 flex items-center justify-between gap-4">
                <div className="text-xs text-slate-400 hidden sm:block">
                  💡 Hỗ trợ phím tắt: Bấm phím 1, 2, 3, 4 trên bàn phím để chọn đáp án.
                </div>
                <button
                  onClick={() => startExam()}
                  className="w-full sm:w-auto px-8 py-3.5 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-extrabold text-base hover:from-blue-700 hover:to-indigo-700 shadow-md shadow-blue-500/25 active:scale-95 transition-all flex items-center justify-center gap-2"
                >
                  <span>🚀 BẮT ĐẦU LÀM BÀI THI</span>
                  <span>→</span>
                </button>
              </div>
            </div>
          </div>
        );
      }

      // -------------------------------------------------------------
      // PHASE 2: IN-EXAM PLAYING SCREEN
      // -------------------------------------------------------------
      if (phase === 'playing') {
        const currentQ = questions[currentIndex];
        const progressPercent = Math.round(((currentIndex) / questions.length) * 100);

        return (
          <div className="max-w-2xl mx-auto py-2">
            <div className="bg-white rounded-3xl border border-slate-200/90 p-6 sm:p-8 shadow-sm">
              {/* Header Bar */}
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-3">
                  <span className="text-xs font-black px-2.5 py-1 rounded-lg bg-slate-100 text-slate-800">
                    CÂU {currentIndex + 1} / {questions.length}
                  </span>
                  <span className="text-xs font-bold text-slate-400">
                    {testMode === 'jp_to_vn' ? '🇯🇵 Nhật → Việt' : testMode === 'vn_to_jp' ? '🇻🇳 Việt → Nhật' : testMode === 'audio_to_vn' ? '🔊 Luyện nghe' : '⏱️ Tốc độ 15s'}
                  </span>
                </div>

                <div className="flex items-center gap-4">
                  {testMode === 'speed_15s' && (
                    <div className={`px-2.5 py-0.5 rounded-lg text-xs font-extrabold flex items-center gap-1 ${
                      timeLeft <= 5 ? 'bg-rose-100 text-rose-700 animate-pulse' : 'bg-amber-100 text-amber-800'
                    }`}>
                      <span>⏱️</span> {timeLeft}s
                    </div>
                  )}
                  <span className="text-xs font-extrabold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg">
                    Điểm: {score}
                  </span>
                  <button
                    onClick={() => { if (confirm('Bạn có chắc chắn muốn nộp bài sớm?')) setPhase('result'); }}
                    className="text-xs text-slate-400 hover:text-slate-600 font-bold"
                  >
                    Nộp bài
                  </button>
                </div>
              </div>

              {/* Progress Bar */}
              <div className="w-full bg-slate-100 h-2 rounded-full mb-8 overflow-hidden">
                <div
                  className="bg-gradient-to-r from-blue-600 to-indigo-600 h-full transition-all duration-300 rounded-full"
                  style={{ width: `${progressPercent}%` }}
                ></div>
              </div>

              {/* Question Card Box */}
              <div className="text-center py-6 px-4 rounded-2xl bg-slate-50/70 border border-slate-100 mb-8">
                {currentQ.mode === 'audio_to_vn' ? (
                  <div>
                    <span className="text-xs font-bold text-blue-600 bg-blue-100/60 px-3 py-1 rounded-full inline-block mb-3">
                      Nghe phát âm và chọn nghĩa đúng
                    </span>
                    <div className="flex items-center justify-center gap-3 my-4">
                      <button
                        onClick={() => speakText(currentQ.target.word || currentQ.target.reading)}
                        className="px-6 py-4 rounded-2xl bg-blue-600 text-white font-extrabold text-base hover:bg-blue-700 shadow-md shadow-blue-500/25 active:scale-95 transition-all flex items-center gap-3"
                      >
                        <span className="text-2xl speaking-pulse">🔊</span>
                        <span>Bấm Nghe Lại Phát Âm</span>
                      </button>
                    </div>
                    {showResult ? (
                      <div className="mt-3 text-sm font-bold text-slate-700 jp-font animate-fadeIn">
                        {currentQ.target.word} ({currentQ.target.reading}) • {currentQ.target.romaji}
                      </div>
                    ) : (
                      <p className="text-xs text-slate-400 mt-2">Mặt chữ sẽ hiển thị sau khi bạn chọn đáp án</p>
                    )}
                  </div>
                ) : currentQ.mode === 'vn_to_jp' ? (
                  <div>
                    <span className="text-xs font-bold text-indigo-600 bg-indigo-100/60 px-3 py-1 rounded-full inline-block mb-3">
                      Chọn từ Tiếng Nhật tương ứng
                    </span>
                    <h3 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-2">
                      "{currentQ.target.meaning}"
                    </h3>
                    <p className="text-xs text-slate-400 font-medium">Bài {currentQ.target.lesson} • {currentQ.target.sub}</p>
                  </div>
                ) : (
                  <div>
                    <span className="text-xs font-bold text-blue-600 bg-blue-100/60 px-3 py-1 rounded-full inline-block mb-3">
                      Nghĩa tiếng Việt của từ này là gì?
                    </span>
                    <h3 className="text-4xl sm:text-5xl font-black text-slate-900 jp-font mb-2 tracking-wide">
                      {currentQ.target.word || currentQ.target.reading}
                    </h3>
                    {currentQ.target.word !== currentQ.target.reading && (
                      <div className="mb-1">
                        {showResult || hintHira ? (
                          <p className="text-lg font-bold text-indigo-600 jp-font animate-fadeIn">
                            {currentQ.target.reading}
                          </p>
                        ) : (
                          <button
                            onClick={() => setHintHira(true)}
                            className="text-xs font-bold px-2.5 py-0.5 rounded-lg bg-indigo-50 text-indigo-600 hover:bg-indigo-100 border border-indigo-200/60 transition-all inline-flex items-center gap-1"
                            title="Xem gợi ý Hiragana"
                          >
                            <span>👁️</span> Hiện Hira (gợi ý)
                          </button>
                        )}
                      </div>
                    )}
                    <div className="flex items-center justify-center gap-2 mt-2">
                      {showResult || hintRomaji ? (
                        <span className="text-xs text-slate-400 font-mono tracking-wider uppercase animate-fadeIn">
                          {currentQ.target.romaji}
                        </span>
                      ) : (
                        <button
                          onClick={() => setHintRomaji(true)}
                          className="text-[11px] font-mono text-slate-400 bg-slate-100 hover:bg-slate-200 px-2 py-0.5 rounded-lg transition-all inline-flex items-center gap-1"
                          title="Xem gợi ý Romaji"
                        >
                          <span>👁️</span> Hiện phiên âm
                        </button>
                      )}
                      <AudioButton text={currentQ.target.word || currentQ.target.reading} size="sm" />
                    </div>
                  </div>
                )}
              </div>

              {/* 4 Options Grid */}
              <div className="space-y-3 mb-6">
                {currentQ.options.map((opt, idx) => {
                  const shortcutNumber = idx + 1;
                  let btnStyle = 'bg-white border-slate-200 text-slate-800 hover:bg-slate-50 hover:border-slate-300 shadow-sm';

                  if (showResult) {
                    if (opt === currentQ.answer) {
                      btnStyle = 'bg-emerald-50 border-emerald-500 text-emerald-950 font-bold ring-2 ring-emerald-400 shadow-sm';
                    } else if (opt === selectedOption) {
                      btnStyle = 'bg-rose-50 border-rose-400 text-rose-900 line-through';
                    } else {
                      btnStyle = 'bg-slate-50 border-slate-200 text-slate-400 opacity-60';
                    }
                  }

                  return (
                    <button
                      key={idx}
                      onClick={() => handleSelectOption(opt)}
                      disabled={showResult}
                      className={`w-full p-4 rounded-2xl border text-left text-sm sm:text-base font-semibold transition-all flex items-center justify-between ${btnStyle}`}
                    >
                      <div className="flex items-center gap-3">
                        <span className={`w-7 h-7 rounded-xl flex items-center justify-center text-xs font-black ${
                          showResult && opt === currentQ.answer
                            ? 'bg-emerald-600 text-white'
                            : 'bg-slate-100 text-slate-500'
                        }`}>
                          {shortcutNumber}
                        </span>
                        <span className="jp-font">{opt}</span>
                      </div>
                      {showResult && opt === currentQ.answer && (
                        <span className="text-emerald-600 font-bold text-lg">✓ Đúng</span>
                      )}
                      {showResult && opt === selectedOption && opt !== currentQ.answer && (
                        <span className="text-rose-500 font-bold text-lg">✗ Sai</span>
                      )}
                    </button>
                  );
                })}
              </div>

              {/* Next Question / Feedback Bar */}
              {showResult && (
                <div className="pt-4 border-t border-slate-100 flex items-center justify-between gap-4 animate-fadeIn">
                  <div className="text-xs text-slate-500">
                    <span className="font-bold text-slate-700">Đáp án chuẩn: </span>
                    <strong className="text-emerald-700 font-extrabold">{currentQ.answer}</strong>
                  </div>
                  <button
                    onClick={handleNextQuestion}
                    className="px-6 py-3 rounded-2xl bg-blue-600 text-white font-extrabold text-sm hover:bg-blue-700 shadow-md shadow-blue-500/20 active:scale-95 transition-all flex items-center gap-2"
                  >
                    <span>{currentIndex + 1 < questions.length ? 'Câu tiếp theo →' : 'Xem Bảng Điểm'}</span>
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      }

      // -------------------------------------------------------------
      // PHASE 3: RESULT & MISTAKE REVIEW SCREEN
      // -------------------------------------------------------------
      if (phase === 'result') {
        const percent = Math.round((score / questions.length) * 100);
        let badgeColor = 'bg-emerald-100 text-emerald-800';
        let trophy = '🏆';
        let feedback = 'Xuất sắc! Bạn đã làm chủ hoàn toàn các từ vựng này!';

        if (percent < 50) {
          badgeColor = 'bg-rose-100 text-rose-800';
          trophy = '📚';
          feedback = 'Cần ôn luyện thêm! Hãy bấm nút Luyện lại câu sai bên dưới để củng cố ngay nhé!';
        } else if (percent < 80) {
          badgeColor = 'bg-amber-100 text-amber-800';
          trophy = '🥈';
          feedback = 'Khá tốt! Bạn chỉ cần xem lại vài từ chưa chính xác là tự tin đi thi rồi.';
        }

        return (
          <div className="max-w-3xl mx-auto py-4">
            <div className="bg-white rounded-3xl border border-slate-200/90 p-6 sm:p-10 shadow-sm mb-6">
              {/* Score Card Header */}
              <div className="text-center py-4">
                <div className="text-5xl mb-3">{trophy}</div>
                <h2 className="text-3xl font-black text-slate-900 mb-2">Kết Quả Bài Kiểm Tra</h2>
                <p className="text-sm text-slate-500 mb-6">{feedback}</p>

                <div className="inline-flex items-center gap-6 p-4 rounded-3xl bg-slate-50 border border-slate-200/80 mb-6">
                  <div className="text-center px-4">
                    <span className="text-xs text-slate-400 font-bold block uppercase tracking-wider">Điểm số</span>
                    <span className="text-3xl sm:text-4xl font-black text-blue-600">{score}</span>
                    <span className="text-sm text-slate-400 font-bold"> / {questions.length}</span>
                  </div>
                  <div className="h-10 w-px bg-slate-200"></div>
                  <div className="text-center px-4">
                    <span className="text-xs text-slate-400 font-bold block uppercase tracking-wider">Tỉ lệ đúng</span>
                    <span className="text-3xl sm:text-4xl font-black text-emerald-600">{percent}%</span>
                  </div>
                  <div className="h-10 w-px bg-slate-200"></div>
                  <div className="text-center px-4">
                    <span className="text-xs text-slate-400 font-bold block uppercase tracking-wider">Số câu sai</span>
                    <span className="text-3xl sm:text-4xl font-black text-rose-500">{wrongList.length}</span>
                  </div>
                </div>

                {/* Action Buttons */}
                <div className="flex flex-wrap items-center justify-center gap-3">
                  {wrongList.length > 0 && (
                    <button
                      onClick={handleRetryWrong}
                      className="px-6 py-3 rounded-2xl bg-rose-600 text-white font-extrabold text-sm hover:bg-rose-700 shadow-md shadow-rose-500/20 active:scale-95 transition-all flex items-center gap-2"
                    >
                      <span>🔁 Luyện lại ngay {wrongList.length} câu làm sai</span>
                    </button>
                  )}
                  <button
                    onClick={() => setPhase('setup')}
                    className="px-6 py-3 rounded-2xl bg-blue-600 text-white font-extrabold text-sm hover:bg-blue-700 shadow-md shadow-blue-500/20 active:scale-95 transition-all"
                  >
                    🔄 Làm đề thi mới
                  </button>
                  <button
                    onClick={onBack}
                    className="px-5 py-3 rounded-2xl bg-slate-100 text-slate-700 font-bold text-sm hover:bg-slate-200 active:scale-95 transition-all"
                  >
                    🎴 Về Flashcard
                  </button>
                </div>
              </div>
            </div>

            {/* Detailed Question Review List */}
            <div className="bg-white rounded-3xl border border-slate-200/90 p-6 sm:p-8 shadow-sm">
              <div className="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">
                <h3 className="font-extrabold text-base text-slate-900">
                  Chi Tiết Từng Câu Hỏi ({questions.length} câu)
                </h3>
                <span className="text-xs text-slate-400">Ấn vào loa để nghe lại phát âm</span>
              </div>

              <div className="divide-y divide-slate-100">
                {questions.map((q, idx) => (
                  <div key={idx} className="py-3.5 flex items-start justify-between gap-4">
                    <div className="flex items-start gap-3">
                      <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold mt-0.5 flex-shrink-0 ${
                        q.isCorrect ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'
                      }`}>
                        {q.isCorrect ? '✓' : '✗'}
                      </span>
                      <div>
                        <div className="flex items-center gap-2 flex-wrap">
                          <span className="text-base font-bold text-slate-900 jp-font">
                            {q.target.word || q.target.reading}
                          </span>
                          {q.target.word !== q.target.reading && (
                            <span className="text-xs text-blue-600 jp-font bg-blue-50 px-1.5 py-0.5 rounded">
                              {q.target.reading}
                            </span>
                          )}
                          <span className="text-xs text-slate-400 font-mono">
                            {q.target.romaji}
                          </span>
                        </div>
                        <p className="text-sm font-semibold text-slate-700 mt-1">
                          👉 Nghĩa: {q.target.meaning}
                        </p>
                        {!q.isCorrect && (
                          <p className="text-xs text-rose-600 font-medium mt-0.5">
                            Bạn đã chọn: <span className="line-through">{q.userChoice}</span>
                          </p>
                        )}
                      </div>
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      <button
                        onClick={() => toggleStar(q.target.id)}
                        className={`text-sm ${starred.has(q.target.id) ? 'text-amber-500' : 'text-slate-300 hover:text-amber-400'}`}
                        title="Đánh dấu sao từ này"
                      >
                        {starred.has(q.target.id) ? '★' : '☆'}
                      </button>
                      <AudioButton text={q.target.word || q.target.reading} size="sm" />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      return null;
    };

    // -------------------------------------------------------------
    // 2. GRAMMAR SECTION
    // -------------------------------------------------------------
    const GrammarSection = ({ selectedLesson, searchQuery }) => {
      const [grammarTab, setGrammarTab] = useState('list'); // list, verbs, past_table
      const [verbGroupFilter, setVerbGroupFilter] = useState('all');
      const [showGrammarRomaji, setShowGrammarRomaji] = useState(false);
      const [revealedGrammarRomaji, setRevealedGrammarRomaji] = useState({});

      // Filter grammar items
      const filteredGrammar = useMemo(() => {
        return grammarData.filter((item) => {
          if (selectedLesson !== 0 && item.lesson !== selectedLesson) return false;
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            return (
              item.title.toLowerCase().includes(q) ||
              item.formula.toLowerCase().includes(q) ||
              item.meaning.toLowerCase().includes(q) ||
              item.explanation.toLowerCase().includes(q)
            );
          }
          return true;
        });
      }, [selectedLesson, searchQuery]);

      // Filter verbs
      const filteredVerbs = useMemo(() => {
        return verbsData.filter((v) => {
          if (verbGroupFilter === 'all') return true;
          if (verbGroupFilter === '1') return v.group === 1;
          if (verbGroupFilter === '2') return v.group === 2;
          if (verbGroupFilter === '3') return v.group === 3;
          if (verbGroupFilter === 'special') return v.rule.includes('Đặc biệt');
          return true;
        });
      }, [verbGroupFilter]);

      return (
        <div>
          {/* Submode switcher */}
          <div className="flex flex-wrap items-center justify-between gap-3 mb-6">
            <div className="flex flex-wrap items-center gap-2 p-1 bg-slate-200/70 rounded-xl max-w-fit">
            <button
              onClick={() => setGrammarTab('list')}
              className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${grammarTab === 'list' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
            >
              📚 Danh sách Cấu trúc ({filteredGrammar.length})
            </button>
            <button
              onClick={() => setGrammarTab('verbs')}
              className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${grammarTab === 'verbs' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
            >
              🔄 Tra cứu Động từ & Thể て ({verbsData.length} từ)
            </button>
            <button
              onClick={() => setGrammarTab('past_table')}
              className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${grammarTab === 'past_table' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
            >
              ⏱️ Ma trận Chia Quá khứ
            </button>
          </div>

          <div>
            <button
              onClick={() => setShowGrammarRomaji(!showGrammarRomaji)}
              className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border text-xs font-bold transition-all ${
                showGrammarRomaji ? 'bg-blue-600 border-blue-600 text-white shadow-sm' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-100'
              }`}
              title="Bật/Tắt hiển thị phiên âm Romaji cho ví dụ"
            >
              <span>🔤</span> {showGrammarRomaji ? 'Ẩn Phiên âm' : 'Hiện Phiên âm'}
            </button>
          </div>
        </div>

          {/* LIST OF GRAMMAR CARDS */}
          {grammarTab === 'list' && (
            <div className="space-y-6">
              {filteredGrammar.map((item) => (
                <div
                  key={item.id}
                  className="bg-white rounded-3xl border border-slate-200/90 p-6 sm:p-8 shadow-sm hover:shadow-md transition-all"
                >
                  {/* Card Header */}
                  <div className="flex items-start justify-between gap-4 mb-4">
                    <div>
                      <span className="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold bg-blue-100 text-blue-700 mb-2">
                        Bài {item.lesson}
                      </span>
                      <h3 className="text-xl sm:text-2xl font-extrabold text-slate-900">
                        {item.title}
                      </h3>
                      <p className="text-sm font-semibold text-slate-600 mt-1">
                        👉 Ý nghĩa: {item.meaning}
                      </p>
                    </div>
                  </div>

                  {/* Formula Box */}
                  <div className="my-4 p-4 rounded-2xl bg-slate-900 text-white font-mono text-sm sm:text-base whitespace-pre-line shadow-inner border border-slate-800">
                    {item.formula}
                  </div>

                  {/* Explanation */}
                  <div className="text-sm text-slate-600 leading-relaxed mb-4">
                    {item.explanation}
                  </div>

                  {/* Examples */}
                  <div className="mt-4 pt-4 border-t border-slate-100">
                    <h4 className="text-xs font-extrabold text-slate-400 uppercase tracking-wider mb-3">
                      Ví dụ thực tế & Phát âm:
                    </h4>
                    <div className="space-y-3">
                      {item.examples.map((ex, idx) => (
                        <div key={idx} className="p-3.5 rounded-2xl bg-slate-50 border border-slate-100 flex items-start justify-between gap-3">
                          <div>
                            <p className="text-base sm:text-lg font-bold text-slate-900 jp-font">
                              {ex.jp}
                            </p>
                            <div className="mt-0.5">
                              {showGrammarRomaji || revealedGrammarRomaji[item.id + '_' + idx] ? (
                                <p className="text-xs text-slate-400 font-mono animate-fadeIn">
                                  {ex.romaji}
                                </p>
                              ) : (
                                <button
                                  onClick={() => setRevealedGrammarRomaji(prev => ({ ...prev, [item.id + '_' + idx]: !prev[item.id + '_' + idx] }))}
                                  className="text-[10px] font-mono text-slate-400 bg-slate-100 hover:bg-slate-200 px-1.5 py-0.5 rounded inline-block active:scale-95"
                                >
                                  👁️ Hiện phiên âm
                                </button>
                              )}
                            </div>
                            <p className="text-sm font-semibold text-blue-700 mt-1">
                              {ex.vn}
                            </p>
                          </div>
                          <AudioButton text={ex.jp} size="sm" />
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Notes / Traps */}
                  {item.notes && (
                    <div className="mt-4 p-3.5 rounded-2xl bg-amber-50 border border-amber-200/80 text-amber-900 text-xs sm:text-sm font-medium flex items-start gap-2.5">
                      <span className="text-base flex-shrink-0">⚠️</span>
                      <div>
                        <strong className="font-bold">Lưu ý đề thi: </strong>
                        {item.notes}
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}

          {/* VERBS & TE-FORM TRAINER */}
          {grammarTab === 'verbs' && (
            <div className="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-sm">
              <div className="mb-6">
                <h3 className="text-2xl font-extrabold text-slate-900 mb-2">
                  Bảng Phân Nhóm Động Từ & Quy Tắc Chia Thể て (Te-form)
                </h3>
                <p className="text-sm text-slate-600">
                  Tất cả 49 động từ trích xuất trực tiếp từ tài liệu <strong>Phân nhóm động từ.pdf (Bài 7)</strong> của học kỳ Fall 2026.
                </p>

                {/* Filter buttons */}
                <div className="flex flex-wrap items-center gap-2 mt-4 text-xs font-semibold">
                  <span className="text-slate-400">Lọc nhóm:</span>
                  <button
                    onClick={() => setVerbGroupFilter('all')}
                    className={`px-3 py-1.5 rounded-xl border ${verbGroupFilter === 'all' ? 'bg-slate-900 text-white' : 'bg-slate-50 border-slate-200 text-slate-700'}`}
                  >
                    Tất cả ({verbsData.length})
                  </button>
                  <button
                    onClick={() => setVerbGroupFilter('1')}
                    className={`px-3 py-1.5 rounded-xl border ${verbGroupFilter === '1' ? 'bg-blue-600 text-white' : 'bg-slate-50 border-slate-200 text-slate-700'}`}

                    Nhóm 1 (Cột i)
                  </button>
                  <button
                    onClick={() => setVerbGroupFilter('2')}
                    className={`px-3 py-1.5 rounded-xl border ${verbGroupFilter === '2' ? 'bg-indigo-600 text-white' : 'bg-slate-50 border-slate-200 text-slate-700'}`}

                      <div className="flex items-center justify-between mb-2">
                        <span className={`text-[11px] font-extrabold px-2 py-0.5 rounded-md ${
