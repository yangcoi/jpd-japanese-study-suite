                        </span>
                        <AudioButton text={v.verb} size="sm" />
                      </div>
                      <div className="text-xl font-extrabold text-slate-900 jp-font">
                        {v.kanji} <span className="text-sm font-semibold text-slate-500">({v.verb})</span>
                      </div>
                      <p className="text-xs font-semibold text-slate-600 mt-1">
                        👉 Nghĩa: {v.meaning}
                      </p>
                    </div>

                    <div className="mt-3 pt-3 border-t border-slate-200/60">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-bold text-slate-400">Thể て:</span>
                        <span className="text-base font-extrabold text-emerald-600 jp-font">
                          {v.te}
                        </span>
                      </div>
                      <p className="text-[11px] text-slate-400 font-mono mt-0.5">
                        {v.rule}
                      </p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* PAST TENSE MATRIX TABLE */}
          {grammarTab === 'past_table' && (
            <div className="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-sm">
              <h3 className="text-2xl font-extrabold text-slate-900 mb-2">
                Ma Trận Chia Thì Quá Khứ (Ngữ Pháp Bài 5)
              </h3>
              <p className="text-sm text-slate-600 mb-6">
                Bảng đối chiếu tổng hợp từ tài liệu <strong>Ngữ pháp 5.docx</strong> dùng để làm bài tập trắc nghiệm và chia động từ.
              </p>

              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse text-sm">
                  <thead>
                    <tr className="border-b border-slate-200 bg-slate-50">
                      <th className="py-3 px-4 font-extrabold text-slate-700">Loại từ</th>
                      <th className="py-3 px-4 font-extrabold text-blue-700">Hiện tại (+)</th>
                      <th className="py-3 px-4 font-extrabold text-slate-500">Hiện tại (-)</th>
                      <th className="py-3 px-4 font-extrabold text-emerald-700">Quá khứ (+)</th>
                      <th className="py-3 px-4 font-extrabold text-rose-700">Quá khứ (-)</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 font-medium text-slate-800">
                    <tr className="hover:bg-slate-50">
                      <td className="py-3.5 px-4 font-bold text-slate-900">Động từ (V)</td>
                      <td className="py-3.5 px-4 text-blue-600 font-bold jp-font">~ます<br/><span className="text-xs text-slate-400 font-normal">たべます</span></td>
                      <td className="py-3.5 px-4 text-slate-600 jp-font">~ません<br/><span className="text-xs text-slate-400 font-normal">たべません</span></td>
                      <td className="py-3.5 px-4 text-emerald-600 font-bold jp-font">~ました<br/><span className="text-xs text-slate-400 font-normal">たべました</span></td>
                      <td className="py-3.5 px-4 text-rose-600 jp-font">~ませんでした<br/><span className="text-xs text-slate-400 font-normal">たべませんでした</span></td>
                    </tr>
                    <tr className="hover:bg-slate-50">
                      <td className="py-3.5 px-4 font-bold text-slate-900">Tính từ Na (Aな)</td>
                      <td className="py-3.5 px-4 text-blue-600 font-bold jp-font">~です<br/><span className="text-xs text-slate-400 font-normal">きれい です</span></td>
                      <td className="py-3.5 px-4 text-slate-600 jp-font">~じゃありません<br/><span className="text-xs text-slate-400 font-normal">きれい じゃありません</span></td>
                      <td className="py-3.5 px-4 text-emerald-600 font-bold jp-font">~でした<br/><span className="text-xs text-slate-400 font-normal">きれい でした</span></td>
                      <td className="py-3.5 px-4 text-rose-600 jp-font">~じゃありませんでした<br/><span className="text-xs text-slate-400 font-normal">きれい じゃありませんでした</span></td>
                    </tr>
                    <tr className="hover:bg-slate-50">
                      <td className="py-3.5 px-4 font-bold text-slate-900">Danh từ (N)</td>
                      <td className="py-3.5 px-4 text-blue-600 font-bold jp-font">~です<br/><span className="text-xs text-slate-400 font-normal">がくせい です</span></td>
                      <td className="py-3.5 px-4 text-slate-600 jp-font">~じゃありません<br/><span className="text-xs text-slate-400 font-normal">がくせい じゃありません</span></td>
                      <td className="py-3.5 px-4 text-emerald-600 font-bold jp-font">~でした<br/><span className="text-xs text-slate-400 font-normal">がくせい でした</span></td>
                      <td className="py-3.5 px-4 text-rose-600 jp-font">~じゃありませんでした<br/><span className="text-xs text-slate-400 font-normal">がくせい じゃありませんでした</span></td>
                    </tr>
                    <tr className="hover:bg-slate-50">
                      <td className="py-3.5 px-4 font-bold text-slate-900">Tính từ I (Aい)</td>
                      <td className="py-3.5 px-4 text-blue-600 font-bold jp-font">~い です<br/><span className="text-xs text-slate-400 font-normal">たかい です</span></td>
                      <td className="py-3.5 px-4 text-slate-600 jp-font">~くない です<br/><span className="text-xs text-slate-400 font-normal">たかくない です</span></td>
                      <td className="py-3.5 px-4 text-emerald-600 font-bold jp-font">~かった です<br/><span className="text-xs text-slate-400 font-normal">たかかった です</span></td>
                      <td className="py-3.5 px-4 text-rose-600 jp-font">~くなかった です<br/><span className="text-xs text-slate-400 font-normal">たかくなかった です</span></td>
                    </tr>
                    <tr className="hover:bg-amber-50/50 bg-amber-50/20">
                      <td className="py-3.5 px-4 font-bold text-amber-900">Đặc biệt: いい (Tốt)</td>
                      <td className="py-3.5 px-4 text-blue-600 font-bold jp-font">いい です</td>
                      <td className="py-3.5 px-4 text-slate-600 jp-font">よくない です</td>
                      <td className="py-3.5 px-4 text-emerald-600 font-bold jp-font">よかった です</td>
                      <td className="py-3.5 px-4 text-rose-600 jp-font">よくなかった です</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    };

    // -------------------------------------------------------------
    // 3. KANJI SECTION
    // -------------------------------------------------------------
    const KanjiSection = ({ selectedLesson, searchQuery, starred, toggleStar }) => {
      const [kanjiTab, setKanjiTab] = useState('flashcard'); // flashcard, grid, quiz, hacks
      const [selectedKanji, setSelectedKanji] = useState(null);
      const [showHira, setShowHira] = useState(false); // default: Hán tự ẩn Hira
      const [showRomaji, setShowRomaji] = useState(false); // default: ẩn phiên âm Roman
      const [revealedHira, setRevealedHira] = useState({});
      const [revealedRomaji, setRevealedRomaji] = useState({});

      const toggleRevealHira = (kanji) => {
        setRevealedHira((prev) => ({ ...prev, [kanji]: !prev[kanji] }));
      };
      const toggleRevealRomaji = (kanji) => {
        setRevealedRomaji((prev) => ({ ...prev, [kanji]: !prev[kanji] }));
      };

      // Filter Kanji
      const filteredKanji = useMemo(() => {
        return kanjiData.filter((k) => {
          if (selectedLesson !== 0) {
            const unitMatch = k.unit === `Unit ${selectedLesson}` || k.unit.includes(String(selectedLesson));
            if (!unitMatch) return false;
          }
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            return (
              k.kanji.toLowerCase().includes(q) ||
              k.hanViet.toLowerCase().includes(q) ||
              k.hiragana.toLowerCase().includes(q) ||
              k.meaning.toLowerCase().includes(q)
            );
          }
          return true;
        });
      }, [selectedLesson, searchQuery]);

      // Flashcard index
      const [cardIndex, setCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      useEffect(() => {
        setCardIndex(0);
        setIsFlipped(false);
      }, [selectedLesson, searchQuery]);

      const currentCard = filteredKanji[cardIndex] || null;

      const nextCard = () => {
        if (!filteredKanji.length) return;
        setIsFlipped(false);
        setCardIndex((prev) => (prev + 1) % filteredKanji.length);
      };

      const prevCard = () => {
        if (!filteredKanji.length) return;
        setIsFlipped(false);
        setCardIndex((prev) => (prev - 1 + filteredKanji.length) % filteredKanji.length);
      };

      const shuffleCards = () => {
        if (!filteredKanji.length) return;
        setIsFlipped(false);
        setCardIndex(Math.floor(Math.random() * filteredKanji.length));
      };

      // Keyboard navigation for Kanji Flashcard
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (kanjiTab !== 'flashcard' || !filteredKanji.length) return;
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            setIsFlipped((prev) => !prev);
          } else if (e.key === 'ArrowRight') {
            nextCard();
          } else if (e.key === 'ArrowLeft') {
            prevCard();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [kanjiTab, filteredKanji.length]);

      return (
        <div>
          {/* Subheader */}
          <div className="flex flex-wrap items-center justify-between gap-3 mb-6">
            <div className="flex items-center gap-1.5 p-1 bg-slate-200/70 rounded-xl">
              <button
                onClick={() => setKanjiTab('flashcard')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${kanjiTab === 'flashcard' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                🎴 Flashcard 3D
              </button>
              <button
                onClick={() => setKanjiTab('grid')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${kanjiTab === 'grid' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                📋 Bảng Tra Cứu ({filteredKanji.length})
              </button>
              <button
                onClick={() => setKanjiTab('quiz')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${kanjiTab === 'quiz' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                ⚡ Speed Quiz
              </button>
              <button
                onClick={() => setKanjiTab('must_pass')}
                className={`px-3.5 py-1.5 rounded-lg text-xs font-extrabold transition-all flex items-center gap-1.5 ${
                  kanjiTab === 'must_pass' 
                    ? 'bg-gradient-to-r from-rose-500 to-amber-500 text-white shadow-md shadow-rose-500/25 ring-2 ring-rose-400' 
                    : 'bg-rose-50 text-rose-700 hover:bg-rose-100 border border-rose-200'
                }`}
              >
                <span>🔥</span> Trọng Tâm Thi 100% (Thời Gian & Động Từ)
              </button>
              <button
                onClick={() => setKanjiTab('hacks')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${kanjiTab === 'hacks' ? 'bg-amber-400 text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                💡 Bí Kíp Đoán Chữ (Cấp Tốc)
              </button>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={() => setShowHira(!showHira)}
                className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border text-xs font-bold transition-all ${
                  showHira 
                    ? 'bg-indigo-600 border-indigo-600 text-white shadow-sm' 
                    : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-100'
                }`}
                title="Bật/Tắt hiển thị Hiragana cho toàn bộ chữ Hán"
              >
                <span>あ</span> {showHira ? 'Ẩn Hira Hán tự' : 'Hiện Hira Hán tự'}
              </button>
              <button
                onClick={() => setShowRomaji(!showRomaji)}
                className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border text-xs font-bold transition-all ${
                  showRomaji 
                    ? 'bg-blue-600 border-blue-600 text-white shadow-sm' 
                    : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-100'
                }`}
                title="Bật/Tắt hiển thị phiên âm Romaji"
              >
                <span>🔤</span> {showRomaji ? 'Ẩn Phiên âm' : 'Hiện Phiên âm'}
              </button>
            </div>
          </div>

          {/* FLASHCARD VIEW */}
          {kanjiTab === 'flashcard' && (
            <div className="max-w-xl mx-auto py-2">
              {filteredKanji.length === 0 ? (
                <div className="text-center py-16 bg-white rounded-3xl border border-slate-200">
                  <p className="text-slate-500 font-medium">Không tìm thấy chữ Hán nào phù hợp.</p>
                </div>
              ) : (
                <div>
                  <div className="flex items-center justify-between text-xs text-slate-500 font-semibold mb-3 px-2">
                    <span>Thẻ {cardIndex + 1} / {filteredKanji.length}</span>
                    <span className="text-slate-400">Chạm hoặc ấn Space để lật</span>
                    <span className="px-2 py-0.5 rounded-md bg-blue-100 text-blue-700 font-bold">
                      {currentCard.unit}
                    </span>
                  </div>

                  {/* 3D Card */}
                  <div
                    onClick={() => setIsFlipped(!isFlipped)}
                    className="relative w-full h-80 sm:h-96 perspective-1000 cursor-pointer select-none group"
                  >
                    <div className={`w-full h-full duration-500 transform-style-3d transition-transform ${isFlipped ? 'rotate-y-180' : ''}`}>
                      {/* FRONT */}
                      <div className="absolute inset-0 w-full h-full rounded-3xl bg-white border border-slate-200 shadow-md p-8 flex flex-col justify-between backface-hidden group-hover:border-blue-400 transition-all">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-slate-100 text-slate-700">
                            {currentCard.unit}
                          </span>
                          <AudioButton text={currentCard.hiragana} size="md" />
                        </div>

                        <div className="text-center my-auto">
                          <h2 className="text-6xl sm:text-7xl font-black text-slate-900 jp-font tracking-tight mb-4">
                            {currentCard.kanji}
                          </h2>
                          <p className="text-lg font-bold text-blue-600 tracking-wider uppercase mb-3">
                            Âm Hán Việt: {currentCard.hanViet}
                          </p>
                          <div className="flex items-center justify-center gap-2 mt-2">
                            {showHira || revealedHira[currentCard.kanji] ? (
                              <span className="text-sm font-bold text-indigo-700 bg-indigo-50 border border-indigo-100 px-3 py-1 rounded-xl jp-font animate-fadeIn">
                                {currentCard.hiragana}
                              </span>
                            ) : (
                              <button
                                onClick={(e) => { e.stopPropagation(); toggleRevealHira(currentCard.kanji); }}
                                className="text-xs font-bold px-3 py-1 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border border-indigo-200 transition-all active:scale-95"
                              >
                                👁️ Hiện Hira
                              </button>
                            )}
                            {showRomaji || revealedRomaji[currentCard.kanji] ? (
                              <span className="text-xs font-mono font-bold text-slate-600 bg-slate-100 px-2.5 py-1 rounded-xl animate-fadeIn">
                                {currentCard.romaji || currentCard.hiragana}
                              </span>
                            ) : (
                              <button
                                onClick={(e) => { e.stopPropagation(); toggleRevealRomaji(currentCard.kanji); }}
                                className="text-xs font-mono font-bold px-2.5 py-1 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-500 border border-slate-200 transition-all active:scale-95"
                              >
                                👁️ Hiện phiên âm
                              </button>
                            )}
                          </div>
                        </div>

                        <div className="text-center text-xs font-semibold text-slate-400">
                          Chạm để xem cách đọc Hiragana & Nghĩa ↻
                        </div>
                      </div>

                      {/* BACK */}
                      <div className="absolute inset-0 w-full h-full rounded-3xl bg-gradient-to-tr from-slate-900 via-indigo-950 to-blue-950 text-white p-8 flex flex-col justify-between backface-hidden rotate-y-180 shadow-md">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-white/10 text-blue-300">
                            Hán tự: {currentCard.kanji}
                          </span>
                          <AudioButton text={currentCard.hiragana} size="md" className="bg-white/10 text-white" />
                        </div>

                        <div className="text-center my-auto">
                          <p className="text-xs text-indigo-300 font-semibold uppercase tracking-wider mb-1">Cách đọc (Furigana / Hiragana)</p>
                          <h4 className="text-3xl sm:text-4xl font-extrabold text-blue-300 jp-font mb-4">
                            {currentCard.hiragana}
                          </h4>
                          <p className="text-xs text-indigo-300 font-semibold uppercase tracking-wider mb-1">Ý nghĩa tiếng Việt</p>
                          <h3 className="text-2xl font-extrabold text-amber-300">
                            {currentCard.meaning}
                          </h3>
                        </div>

                        <div className="text-center text-xs font-semibold text-indigo-300">
                          Chạm để quay lại mặt trước ↻
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Nav */}
                  <div className="flex items-center justify-center gap-4 mt-6">
                    <button
                      onClick={prevCard}
                      className="px-5 py-2.5 rounded-2xl bg-white border border-slate-200 text-slate-700 font-bold text-sm hover:bg-slate-100 hover:border-slate-300 shadow-sm active:scale-95 transition-all flex items-center gap-2"
                    >
                      ← Chữ trước
                    </button>
                    <button
                      onClick={shuffleCards}
                      className="p-2.5 rounded-2xl bg-white border border-slate-200 text-slate-500 hover:text-blue-600 hover:border-blue-300 shadow-sm transition-all"
                      title="Xáo trộn ngẫu nhiên"
                    >
                      🔀
                    </button>
                    <button
                      onClick={nextCard}
                      className="px-6 py-2.5 rounded-2xl bg-blue-600 text-white font-bold text-sm hover:bg-blue-700 shadow-md shadow-blue-500/20 active:scale-95 transition-all flex items-center gap-2"
                    >
                      Chữ kế tiếp →
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* GRID VIEW */}
          {kanjiTab === 'grid' && (
            <div className="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-sm">
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
                {filteredKanji.map((k, idx) => (
                  <div
                    key={idx}
                    onClick={() => setSelectedKanji(k)}
                    className="p-4 rounded-2xl border border-slate-100 bg-slate-50/80 hover:bg-white hover:border-blue-400 hover:shadow-md cursor-pointer transition-all text-center group flex flex-col justify-between min-h-[155px]"
                  >
                    <div>
                      <div className="text-3xl font-black text-slate-900 jp-font group-hover:text-blue-600 transition-colors">
                        {k.kanji}
                      </div>
                      <div className="text-[11px] font-bold text-slate-500 uppercase mt-1">
                        {k.hanViet}
                      </div>
                    </div>

                    <div className="my-2 space-y-1.5" onClick={(e) => e.stopPropagation()}>
                      <div>
                        {showHira || revealedHira[k.kanji] ? (
                          <span
                            onClick={() => toggleRevealHira(k.kanji)}
                            title="Bấm để ẩn Hira"
                            className="text-xs font-bold text-indigo-700 jp-font bg-indigo-50 border border-indigo-100 py-0.5 px-2 rounded-lg inline-block cursor-pointer hover:bg-indigo-100 transition-all"
                          >
                            {k.hiragana}
                          </span>
                        ) : (
                          <button
                            onClick={() => toggleRevealHira(k.kanji)}
                            className="text-[10px] font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200/60 px-2 py-0.5 rounded-md transition-all active:scale-95"
                            title="Bấm để xem cách đọc Hiragana"
                          >
                            👁️ Hiện Hira
                          </button>
                        )}
                      </div>

                      <div>
                        {showRomaji || revealedRomaji[k.kanji] ? (
                          <span
                            onClick={() => toggleRevealRomaji(k.kanji)}
                            title="Bấm để ẩn phiên âm"

          {/* SPEED QUIZ */}
          {kanjiTab === 'quiz' && (

          {/* MUST-PASS KANJI CENTER VIEW */}

            <MustPassKanjiView />

          {kanjiTab === 'hacks' && (

          {/* Kanji Modal */}
          {selectedKanji && (

    };

    // Kanji Speed Quiz Engine
    const KanjiQuizEngine = ({ kanjiList, onBack }) => {
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [showResult, setShowResult] = useState(false);
      const [isFinished, setIsFinished] = useState(false);

      const startQuiz = () => {
        if (kanjiList.length < 4) return;
        const shuffled = [...kanjiList].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, Math.min(10, shuffled.length));

        const generated = selected.map((target) => {
          const wrong = kanjiList
            .filter((k) => k.kanji !== target.kanji)
            .sort(() => 0.5 - Math.random())
            .slice(0, 3)
            .map((k) => `${k.hiragana} (${k.meaning})`);

          const correct = `${target.hiragana} (${target.meaning})`;
          const all = [...wrong, correct].sort(() => 0.5 - Math.random());
          return { target, options: all, answer: correct };
        });

        setQuestions(generated);
        setCurrentIndex(0);
        setScore(0);
        setSelectedOption(null);
        setShowResult(false);
        setIsFinished(false);
      };

      useEffect(() => { startQuiz(); }, [kanjiList]);

      if (!questions.length) return null;

      if (isFinished) {
        return (
          <div className="max-w-md mx-auto py-8 text-center bg-white rounded-3xl border border-slate-200 p-8 shadow-sm">
            <h3 className="text-2xl font-extrabold text-slate-900 mb-2">Hoàn thành bài Kanji Quiz!</h3>
            <p className="text-slate-600 mb-6">Đạt <span className="text-2xl font-black text-blue-600">{score}</span> / {questions.length} điểm</p>
            <button onClick={startQuiz} className="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-bold text-sm hover:bg-blue-700">
              Luyện lại
            </button>
          </div>
        );
      }

      const currentQ = questions[currentIndex];

      const handleSelect = (opt) => {
        if (showResult) return;
        setSelectedOption(opt);
        setShowResult(true);
        if (opt === currentQ.answer) setScore(s => s + 1);
      };

      const handleNext = () => {
        if (currentIndex + 1 < questions.length) {
          setCurrentIndex(i => i + 1);
          setSelectedOption(null);
          setShowResult(false);
        } else {
          setIsFinished(true);
        }
      };

      return (
        <div className="max-w-xl mx-auto py-4">
          <div className="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-sm">
            <div className="flex items-center justify-between text-xs font-bold text-slate-400 mb-6">
              <span>CÂU HỎI {currentIndex + 1} / {questions.length}</span>
              <span className="text-emerald-600 font-extrabold">Điểm: {score}</span>
            </div>

            <div className="text-center mb-8">
              <span className="text-xs text-blue-600 font-semibold px-2.5 py-1 rounded-full bg-blue-50 mb-3 inline-block">
                Hán tự này đọc là gì và có nghĩa gì?
              </span>
              <h3 className="text-6xl font-black text-slate-900 jp-font mb-2">
                {currentQ.target.kanji}
              </h3>
              <p className="text-xs font-bold text-slate-400 uppercase">
                Hán Việt: {currentQ.target.hanViet}
              </p>
            </div>

            <div className="space-y-3">
              {currentQ.options.map((opt, idx) => {
                let style = 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100';
                if (showResult) {
                  if (opt === currentQ.answer) style = 'bg-emerald-50 border-emerald-500 text-emerald-800 font-bold';
                  else if (opt === selectedOption) style = 'bg-rose-50 border-rose-500 text-rose-800 line-through';
                  else style = 'bg-slate-50 border-slate-200 text-slate-400 opacity-60';
                }
                return (
                  <button
                    key={idx}
                    onClick={() => handleSelect(opt)}
                    disabled={showResult}
                    className={`w-full p-4 rounded-2xl border text-left font-semibold text-sm transition-all flex items-center justify-between ${style}`}
                  >
                    <span>{opt}</span>
                    {showResult && opt === currentQ.answer && <span className="text-emerald-600">✓</span>}
                  </button>
                );
              })}
            </div>

            {showResult && (
              <div className="mt-6 pt-4 border-t border-slate-100 flex justify-end">
                <button onClick={handleNext} className="px-6 py-2.5 rounded-xl bg-blue-600 text-white font-bold text-sm hover:bg-blue-700">
                  {currentIndex + 1 < questions.length ? 'Câu tiếp theo →' : 'Xem kết quả'}
                </button>
              </div>
            )}
          </div>
        </div>
      );
    };

        setCardIndex((prev) => (prev + 1) % filteredItems.length);
      };

      const prevCard = () => {
        if (!filteredItems.length) return;
        setIsFlipped(false);
        setCardIndex((prev) => (prev - 1 + filteredItems.length) % filteredItems.length);

                  </span>

                    78 Chữ Hán Trọng Tâm
                  </span>
                </div>
                <h3 className="text-2xl sm:text-3xl font-black tracking-tight">
                  Bộ Hán Tự 100% Xuất Hiện Trong Đề Thi JPD123
                </h3>
                <p className="text-white/90 text-sm mt-1 max-w-2xl">
                  Tổng hợp độc quyền Ma trận thời gian (Ngày - Tuần - Tháng - Năm - Thứ), các ngày đặc biệt và 32 Động từ cốt lõi chắc chắn ra trong bài đọc Reading & câu hỏi Speaking.
                </p>
              </div>

              {/* Quick Actions */}
              <div className="flex items-center gap-2 flex-wrap">
                <button
                  onClick={() => setSubTab('matrix')}
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-sm flex items-center gap-1.5 ${
                    subTab === 'matrix' ? 'bg-white text-slate-900 ring-2 ring-white/50' : 'bg-black/20 text-white hover:bg-black/30'
                  }`}
                >
                  <span>📋</span> Ma Trận & Mẹo
                </button>
                <button
                  onClick={() => setSubTab('flashcard')}
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-sm flex items-center gap-1.5 ${
                    subTab === 'flashcard' ? 'bg-white text-slate-900 ring-2 ring-white/50' : 'bg-black/20 text-white hover:bg-black/30'
                  }`}
                >
                  <span>🎴</span> Flashcard 3D
                </button>
                <button
                  onClick={() => setSubTab('quiz')}
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-sm flex items-center gap-1.5 ${
                    subTab === 'quiz' ? 'bg-white text-slate-900 ring-2 ring-white/50' : 'bg-black/20 text-white hover:bg-black/30'
                  }`}
                >
                  <span>⚡</span> Test Cấp Tốc

          {/* SUBTAB 1: MATRIX & HACKS */}

                    title="Bật/Tắt hiển thị phiên âm Romaji toàn bộ"

              </div>

              {/* Card Grid of Must Pass Kanji */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">

                    <div>

    // -------------------------------------------------------------
    // 5. READING SECTION (10 Practice Passages + Demo Passage)

    const ReadingSection = () => {
      const [passageIndex, setPassageIndex] = useState(0);
      const [examMode, setExamMode] = useState(true); // true = Thi Thật (No furigana/popups), false = Luyện tập

      const [isPlayingFull, setIsPlayingFull] = useState(false);

      const currentPassage = readingData[passageIndex] || readingData[0] || { tokens: [], title: "Bài đọc" };
      const tokens = currentPassage.tokens || [];

      // Cancel audio on unmount or passage change
      useEffect(() => {
        window.speechSynthesis?.cancel();
        setIsPlayingFull(false);
      }, [passageIndex]);

      // Play full text
      const handlePlayFull = () => {
        if (isPlayingFull) {
          window.speechSynthesis.cancel();
          setIsPlayingFull(false);
          return;
        }
        setIsPlayingFull(true);
        const fullText = tokens.map(t => t.text).join('') || (currentPassage.paragraphs || []).join(' ');
        speakText(fullText, 'ja-JP', () => setIsPlayingFull(false));

          {/* Header & Passage Selector Bar */}

                    onClick={() => { window.speechSynthesis?.cancel(); setIsPlayingFull(false); setPassageIndex(idx); setActiveToken(null); setShowTranslation(false); }}

              <div>
                <span className="text-xs font-extrabold px-2.5 py-1 rounded-full bg-blue-100 text-blue-700">
                  {passageIndex === 0 ? 'Đề Thi Mẫu' : `Đề Số ${passageIndex}`}

                  {currentPassage.title}
                </h3>
                <p className="text-xs text-slate-500 mt-1">

                </p>
              </div>

              {/* Mode Toggle & Audio Controls */}
              <div className="flex flex-wrap items-center gap-2">

                  }`}

                  className={`px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-sm flex items-center gap-2 ${

                    tokenClass += 'bg-emerald-100 text-emerald-900 px-1 py-0.5 rounded cursor-pointer hover:bg-emerald-200 ';
                  } else if (token.type === 'kanji') {
                    tokenClass += 'cursor-pointer hover:text-blue-600 hover:underline ';
                  } else if (token.text !== '。' && token.text !== '、') {
                    tokenClass += 'cursor-pointer hover:text-blue-600 ';

                if (isSelected) {
                  tokenClass += 'ring-2 ring-blue-500 bg-blue-100 rounded ';

    // React Error Boundary to prevent White Screen of Death
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-4 bg-slate-50">
              <div className="max-w-md w-full bg-white rounded-3xl p-8 border border-slate-200 shadow-xl text-center">
                <div className="w-16 h-16 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto text-2xl font-bold mb-4">
                  ⚠️
                </div>
                <h2 className="text-xl font-black text-slate-900 mb-2">Đã xảy ra sự cố hiển thị</h2>
                <p className="text-xs text-slate-500 mb-6 font-mono bg-slate-100 p-3 rounded-xl break-words">
                  {this.state.error?.message || "Lỗi giao diện không xác định"}
                </p>
                <div className="flex items-center justify-center gap-3">
                  <button
                    onClick={() => { this.setState({ hasError: false }); window.location.reload(); }}
                    className="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-bold text-xs hover:bg-blue-700 shadow-sm"
                  >
                    Tải lại trang
                  </button>
                  <button
                    onClick={() => this.setState({ hasError: false })}
                    className="px-5 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs hover:bg-slate-200"
                  >
                    Thử phục hồi
                  </button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

                      Phòng Thi Vấn Đáp Trực Tuyến
                    </span>
                    <h3 className="text-lg font-black text-white mt-0.5">
                      Đề Câu Hỏi #{simIndex + 1} / {pictureItems.length} (Bài {currentSimItem.lesson})
                    </h3>
                  </div>

                  {/* Timer Badge */}
                  <div
                    className={`flex items-center gap-2 px-4 py-2 rounded-2xl font-black text-lg shadow-md transition-all ${
                      simTimeLeft <= 5
                        ? 'bg-rose-500 text-white animate-pulse'
                        : 'bg-indigo-600 text-white'
                    }`}
                  >
                    <span>⏱️</span>
                    <span>{simTimeLeft}s</span>
                  </div>
                </div>

                {/* Progress Bar */}
                <div className="w-full bg-slate-100 h-2">
                  <div
                    className={`h-2 transition-all duration-1000 ${
                      simTimeLeft <= 5 ? 'bg-rose-500' : 'bg-indigo-600'
                    }`}
                    style={{ width: `${(simTimeLeft / 15) * 100}%` }}
                  />
                </div>

                <div className="p-6">
                  {/* Picture */}
                  {currentSimItem.image && (
                    <div className="mb-6 p-4 rounded-2xl bg-slate-50 border border-slate-200/80 flex items-center justify-center">
                      <img
                        src={currentSimItem.image}
                        alt="Exam question picture"
                        className="max-h-64 object-contain rounded-xl shadow-xs"
                      />
                    </div>
                  )}

                  {/* Question from Examiner */}
                  <div className="mb-6 text-center">
                    <span className="text-xs font-black text-indigo-600 uppercase tracking-widest bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100 inline-block mb-2">
                      Giám thị hỏi:
                    </span>
                    <h2 className="text-2xl sm:text-3xl font-black text-slate-900 jp-font mb-2">
                      {currentSimItem.question}
                    </h2>
                    <p className="text-sm text-slate-500 italic">
                      ({currentSimItem.question_vn})
                    </p>
                    <div className="mt-3">
                      <button
                        onClick={() => speakText(currentSimItem.question)}
                        className="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold inline-flex items-center gap-1.5 transition-all shadow-xs"
                      >
                        <span>🔊</span> Nghe lại câu hỏi
                      </button>
                    </div>
                  </div>

                  {/* Answer Reveal Area */}
                  {simRevealed ? (
                    <div className="p-5 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-950 animate-fadeIn mb-6">
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-black text-emerald-800 uppercase tracking-wider flex items-center gap-1">
                          <span>✅</span> Câu trả lời chuẩn:
                        </span>
                        <AudioButton text={currentSimItem.sample_answer} size="sm" />
                      </div>
                      <p className="text-xl sm:text-2xl font-black text-emerald-900 jp-font mb-1">
                        {currentSimItem.sample_answer}
                      </p>
                      <p className="text-sm text-emerald-700 font-medium">
                        {currentSimItem.sample_answer_vn}
                      </p>
                      {currentSimItem.exam_tips && (
                        <div className="mt-3 pt-3 border-t border-emerald-200/80 text-xs text-amber-900 bg-amber-50/70 p-3 rounded-xl border border-amber-200/60">
                          💡 <strong>Phân tích giám thị:</strong> {currentSimItem.exam_tips}
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="text-center py-4 mb-4">
                      <button
                        onClick={() => {
                          setSimTimerActive(false);
                          setSimRevealed(true);
                        }}
                        className="px-6 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm shadow-md shadow-indigo-500/25 transition-all"
                      >
                        👁️ Tôi đã nói xong - Xem kết quả
                      </button>
                    </div>
                  )}

                  {/* Simulator Controls */}
                  <div className="flex items-center justify-between gap-3 pt-4 border-t border-slate-100">
                    <button
                      onClick={randomSimQuestion}
                      className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-50 transition-all flex items-center gap-1.5"
                    >
                      <span>🎲</span> Bốc câu ngẫu nhiên
                    </button>
                    <button
                      onClick={nextSimQuestion}
                      className="px-6 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-black transition-all flex items-center gap-1.5 shadow-sm"
                    >
                      <span>Câu kế tiếp</span> <span>→</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* VIEW MODE 3: QUIZ */}
          {viewMode === 'quiz' && currentQuizItem && (
            <div className="max-w-xl mx-auto py-2">
              <div className="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden animate-fadeIn p-6">
                <div className="flex items-center justify-between text-xs font-bold text-slate-500 mb-4 pb-3 border-b border-slate-100">
                  <span>Câu hỏi {quizIndex + 1} / {pictureItems.length}</span>
                  <span className="px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-700 font-extrabold">
                    Điểm: {quizScore} / {quizTotal}
                  </span>
                </div>

                {/* Picture */}
                {currentQuizItem.image && (
                  <div className="mb-4 p-3 rounded-2xl bg-slate-50 border border-slate-200/80 flex items-center justify-center">
                    <img
                      src={currentQuizItem.image}
                      alt="Quiz question picture"
                      className="max-h-48 object-contain rounded-xl shadow-xs"
                    />
                  </div>
                )}

                {/* Question */}
                <div className="mb-5 text-center">
                  <div className="flex items-center justify-center gap-2 mb-1">
                    <span className="text-xs font-extrabold text-indigo-600 uppercase">Giám thị hỏi:</span>
                    <AudioButton text={currentQuizItem.question} size="sm" />
                  </div>
                  <h3 className="text-xl font-black text-slate-900 jp-font">
                    {currentQuizItem.question}
                  </h3>
                  <p className="text-xs text-slate-500 mt-0.5 italic">
                    {currentQuizItem.question_vn}
                  </p>
                </div>

                {/* 4 Choices */}
                <div className="space-y-2.5 mb-6">
                  {quizChoices.map((choice, cidx) => {
                    const isSelected = selectedChoice === choice;
                    const isCorrect = choice === currentQuizItem.sample_answer;
                    let btnStyle = 'bg-slate-50 hover:bg-slate-100 border-slate-200 text-slate-800';

                    if (selectedChoice !== null) {
                      if (isCorrect) {
                        btnStyle = 'bg-emerald-500 border-emerald-500 text-white font-extrabold shadow-sm';
                      } else if (isSelected && !isCorrect) {
                        btnStyle = 'bg-rose-500 border-rose-500 text-white font-extrabold';
                      } else {
                        btnStyle = 'bg-slate-50 border-slate-200 text-slate-400 opacity-60';
                      }
                    }

                    return (
                      <button
                        key={cidx}
                        onClick={() => handleSelectChoice(choice)}
                        className={`w-full p-3.5 rounded-2xl border text-left text-sm font-semibold transition-all flex items-center justify-between gap-3 ${btnStyle}`}
                      >
                        <div className="flex items-center gap-2.5">
                          <span className="w-6 h-6 rounded-full bg-black/10 flex items-center justify-center text-xs font-black">
                            {['A', 'B', 'C', 'D'][cidx]}
                          </span>
                          <span className="jp-font text-base">{choice}</span>
                        </div>
                        {selectedChoice !== null && isCorrect && <span>✅</span>}
                        {selectedChoice !== null && isSelected && !isCorrect && <span>❌</span>}
                      </button>
                    );
                  })}
                </div>

                {/* Result Feedback & Next */}
                {selectedChoice !== null && (
                  <div className="pt-4 border-t border-slate-100 flex items-center justify-between gap-3 animate-fadeIn">
                    <div className="text-xs">
                      {selectedChoice === currentQuizItem.sample_answer ? (
                        <span className="text-emerald-700 font-extrabold">🎉 Chính xác! Bạn trả lời rất chuẩn.</span>
                      ) : (
                        <span className="text-rose-700 font-extrabold">❌ Chưa đúng! Đáp án là: {currentQuizItem.sample_answer}</span>
                      )}
                    </div>
                    <button
                      onClick={nextQuizQuestion}
                      className="px-5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-black transition-all shadow-sm flex items-center gap-1"
                    >
                      <span>Câu kế tiếp</span> <span>→</span>
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Image Zoom Modal */}
          {zoomedImage && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm animate-fadeIn"
              onClick={() => setZoomedImage(null)}
            >
              <div
                className="bg-white rounded-3xl p-4 max-w-3xl max-h-[90vh] overflow-hidden shadow-2xl relative"
                onClick={(e) => e.stopPropagation()}
              >
                <button
                  onClick={() => setZoomedImage(null)}
                  className="absolute top-3 right-3 w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center font-bold text-sm shadow-sm"
                >
                  ✕
                </button>
                <img
                  src={zoomedImage}
                  alt="Zoomed picture"
                  className="w-full h-auto max-h-[80vh] object-contain rounded-2xl"
                />
              </div>
            </div>
          )}
        </div>
      );
    };

const App = () => {
      const [activeTab, setActiveTab] = useState('vocab');
      const [selectedLesson, setSelectedLesson] = useState(0); // 0 = all, 4, 5, 6, 7
      const [searchQuery, setSearchQuery] = useState('');
      const [archiveOpen, setArchiveOpen] = useState(false);

      // Starred favorites in LocalStorage
      const [starred, setStarred] = useState(() => {
        try {
          const saved = localStorage.getItem('jpd123_starred');
          return saved ? new Set(JSON.parse(saved)) : new Set();
        } catch (e) {
          return new Set();
        }
      });

      const toggleStar = (id) => {
        setStarred((prev) => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          try {
            localStorage.setItem('jpd123_starred', JSON.stringify(Array.from(next)));
          } catch (e) {}
          return next;
        });
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Top Navbar */}
          <Navbar
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            selectedLesson={selectedLesson}
            setSelectedLesson={setSelectedLesson}
            onOpenArchive={() => setArchiveOpen(true)}
            searchQuery={searchQuery}
            setSearchQuery={setSearchQuery}
          />

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            {/* Unified Lesson Filter */}
            <LessonSelector
              selectedLesson={selectedLesson}
              setSelectedLesson={setSelectedLesson}
              activeTab={activeTab}
            />

            {/* Active Tab View */}
            {activeTab === 'must_pass' && (
              <MustPassKanjiView />
            )}

            {activeTab === 'speaking_pictures' && (
              <SpeakingPicturesView />
            )}

            {activeTab === 'vocab' && (
              <VocabSection
                selectedLesson={selectedLesson}
                searchQuery={searchQuery}
                starred={starred}
                toggleStar={toggleStar}
              />
            )}

            {activeTab === 'grammar' && (
              <GrammarSection
                selectedLesson={selectedLesson}
                searchQuery={searchQuery}
              />
            )}

            {activeTab === 'kanji' && (
              <KanjiSection
                selectedLesson={selectedLesson}
                searchQuery={searchQuery}
                starred={starred}
                toggleStar={toggleStar}
              />
            )}

            {activeTab === 'speaking' && (
              <SpeakingSection
                selectedLesson={selectedLesson}
                searchQuery={searchQuery}
              />
            )}

            {activeTab === 'reading' && (
              <ReadingSection />
            )}
          </main>

          {/* Archive Modal */}
          <ArchiveModal isOpen={archiveOpen} onClose={() => setArchiveOpen(false)} />

          {/* Footer */}
          <footer className="mt-auto py-6 border-t border-slate-200/80 bg-white text-center text-xs text-slate-500">
            <p className="font-semibold text-slate-700">JPD123 Tiếng Nhật 2 • Học kỳ Fall 2026</p>
            <p className="mt-1 text-slate-400">
              Được thiết kế và chuẩn hóa theo tài liệu ôn tập chính thức: Bài 4, 5, 6, 7 • Speaking Test Demo • 10 Đề Reading Test
            </p>
          </footer>
        </div>
      );
    };

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
